<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b2633">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<title>Remote</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px 16px;
    background: #0b2633;
    color: #eef4f7;
    font: 17px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }
  main {
    max-width: 380px;
    padding: 28px 24px;
    border-radius: 24px;
    background: rgba(255, 255, 255, 0.08);
    border: 1px solid rgba(255, 255, 255, 0.12);
  }
  .eyebrow { font-size: 13px; letter-spacing: 0.12em; text-transform: uppercase; opacity: 0.7; }
  h1 { margin: 4px 0 14px; font-size: 28px; font-weight: 600; }
  p { margin: 0 0 12px; }
  ol { margin: 0 0 12px; padding-left: 22px; }
  li { margin-bottom: 6px; }
  .small { font-size: 14px; opacity: 0.75; margin: 0; }
</style>
</head>
<body>
<main>
  <div class="eyebrow">Remote</div>
  <h1>The remote has moved</h1>
  <p>This old remote no longer works. To set up the new one on this phone:</p>
  <ol>
    <li>On the TV, go to <b>+</b> at the end of the apps and press OK.</li>
    <li>Scan the QR code with this phone’s camera and tap <b>Add this phone</b>.</li>
  </ol>
  <p class="small">You can delete this icon from the home screen afterwards.</p>
</main>
<script>
  // the old remote's saved key belongs to the retired relay
  try {
    Object.keys(localStorage).forEach(function (k) { if (k.indexOf('tvremote.') === 0) localStorage.removeItem(k); });
  } catch (e) { /* storage unavailable */ }
  if (location.hash) history.replaceState(null, '', location.pathname);
</script>
</body>
</html>
